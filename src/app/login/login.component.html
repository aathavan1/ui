<main class="ocean-login">
    <div class="ocean-layout">
        <section class="welcome-column" aria-label="Workspace welcome">
            <a class="brand-link" href="/login" aria-label="Workspace home">
                <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
                <span>WORKSPACE</span>
            </a>

            <div class="welcome-copy">
                <p class="welcome-kicker"><span class="kicker-dot"></span> A CLEARER KIND OF DAY</p>
                <h1>Find your<br><em>flow.</em></h1>
                <p class="welcome-description">Bring your plans into calmer waters. Make space for the work and life that matter.</p>
            </div>

            <div class="water-art" aria-hidden="true">
                <span class="wave-band"></span>
                <span class="wave-band"></span>
                <span class="wave-band"></span>
            </div>
            <p class="welcome-footer"><strong>01</strong> MAKE SPACE FOR WHAT MATTERS</p>
        </section>

        <section class="auth-panel" aria-labelledby="login-heading">
            <div class="login-content">
                <div class="form-heading">
                    <p class="form-kicker">YOUR SPACE IS READY</p>
                    <h2 id="login-heading">Welcome back<span>.</span></h2>
                    <p class="form-intro">Sign in and ease back into your day.</p>
                </div>

                <form class="login-form" (ngSubmit)="signIn()">
                    <label for="username">Email address</label>
                    <input
                        id="username"
                        name="username"
                        type="email"
                        [(ngModel)]="username"
                        autocomplete="username"
                        placeholder="you@example.com"
                        required>

                    <div class="password-label-row">
                        <label for="password">Password</label>
                    </div>
                    <div class="password-field">
                        <input
                            id="password"
                            name="password"
                            [type]="passwordVisible ? 'text' : 'password'"
                            [(ngModel)]="password"
                            autocomplete="current-password"
                            placeholder="Enter your password"
                            required>
                        <button class="visibility-toggle" type="button" (click)="passwordVisible = !passwordVisible" [attr.aria-label]="passwordVisible ? 'Hide password' : 'Show password'">
                            {{ passwordVisible ? 'Hide' : 'Show' }}
                        </button>
                    </div>

                    <label class="remember-option">
                        <input type="checkbox" name="remember">
                        <span class="custom-checkbox" aria-hidden="true"></span>
                        <span>Keep me signed in</span>
                    </label>

                    <button class="submit-button" type="submit">
                        <span>Sign in</span>
                        <span class="button-arrow" aria-hidden="true"></span>
                    </button>
                </form>

                <p class="form-note"><span class="note-wave" aria-hidden="true"></span> A quieter space starts here.</p>
            </div>
            <span class="form-index" aria-hidden="true">01 / 01</span>
        </section>
    </div>
</main>
